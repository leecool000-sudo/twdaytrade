name: tw-daytrade-paper

on:
  schedule:
    # GitHub 用 UTC。台北 08:20 = UTC 00:20,週一到週五。
    - cron: "20 0 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "sim = 離線模擬(幾秒跑完,驗證流程);live = 真實行情(會等到 09:00,跑到收盤)"
        type: choice
        options: [sim, live]
        default: sim

concurrency:
  group: tw-daytrade-paper
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330          # 08:20 → 13:30 約 5 小時 10 分,留一點餘裕(上限 360)
    env:
      TZ: Asia/Taipei
      PYTHONUNBUFFERED: "1"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_MENTION: ${{ secrets.DISCORD_MENTION }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Run
        shell: bash                # 預設含 -eo pipefail,python 失敗時整個步驟會標紅
        run: |
          mkdir -p out
          python -u main.py --mode "${{ inputs.mode || 'live' }}" --top 60 2>&1 | tee run.log

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tw-daytrade-${{ github.run_id }}
          path: |
            run.log
            out/
          if-no-files-found: warn
          retention-days: 90
